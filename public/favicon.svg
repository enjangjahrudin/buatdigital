<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bdGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#38BDF8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded icon -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bdGrad)" stroke="#38BDF8" stroke-width="1.5" />

  <!-- Stylized Monogram "B" & Digital Spark -->
  <!-- Left Pillar of B -->
  <rect x="16" y="15" width="7" height="34" rx="3.5" fill="#FFFFFF" />

  <!-- Top Loop of B -->
  <path d="M21 15 H33 C38 15 41 18 41 23 C41 28 38 31 33 31 H21 Z" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" />

  <!-- Bottom Loop of B -->
  <path d="M21 31 H35 C41 31 45 35 45 41 C45 47 41 49 35 49 H21 Z" fill="none" stroke="url(#glowGrad)" stroke-width="6" stroke-linejoin="round" filter="url(#shadow)" />

  <!-- Digital Circuit Accent Dot -->
  <circle cx="47" cy="18" r="3.5" fill="#38BDF8" />
</svg>
