<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Panel Admin - BuatDigital.id</title>
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <!-- Tailwind CSS & FontAwesome CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between font-sans selection:bg-blue-600 selection:text-white">

  <!-- Header -->
  <header class="p-6">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <a href="/" class="flex items-center space-x-3 group">
        <img src="favicon.svg" alt="Logo" class="w-10 h-10 rounded-2xl shadow-sm border border-slate-200">
        <div>
          <h1 class="text-base font-bold text-slate-900 tracking-tight">BuatDigital<span class="text-blue-600">.id</span></h1>
          <p class="text-xs text-slate-500">Admin Control Center</p>
        </div>
      </a>
      <a href="/" class="text-xs text-slate-600 hover:text-slate-900 transition-colors flex items-center gap-1.5 px-3.5 py-2 rounded-xl border border-slate-200 bg-white shadow-sm hover:bg-slate-50">
        <i class="fa-solid fa-arrow-left"></i> Kembali ke Web
      </a>
    </div>
  </header>

  <!-- Login Form Main Card -->
  <main class="flex-1 flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white text-slate-800 rounded-3xl shadow-xl shadow-slate-200/50 p-8 border border-slate-200 space-y-6">

      <div class="text-center space-y-2">
        <div class="inline-flex p-3.5 rounded-2xl bg-blue-50 text-blue-600 mb-1 border border-blue-100 shadow-sm">
          <i class="fa-solid fa-shield-halved text-2xl"></i>
        </div>
        <h2 class="text-xl font-bold text-slate-900">Login Dashboard Admin</h2>
        <p class="text-xs text-slate-500">Masukkan PIN Admin untuk mengelola katalog produk, harga, dan laporan penjualan BuatDigital.id.</p>
      </div>

      <div id="loginMsg" class="hidden p-3 rounded-xl text-xs"></div>

      <form id="adminLoginForm" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1.5">PIN Keamanan Admin:</label>
          <div class="relative">
            <i class="fa-solid fa-lock absolute left-3.5 top-3.5 text-slate-400 text-xs"></i>
            <input type="password" id="pinInput" required placeholder="Masukkan PIN Admin" autofocus
                   class="w-full pl-9 pr-4 py-2.5 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent">
          </div>
          <p class="text-[11px] text-slate-400 mt-1.5">PIN Default: <code class="bg-slate-100 px-1 py-0.5 rounded font-mono text-slate-600">admin123</code></p>
        </div>

        <button type="submit" id="loginBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-xl text-sm flex items-center justify-center gap-2 shadow-sm hover:shadow transition-all">
          <i class="fa-solid fa-unlock"></i> Masuk ke Dashboard
        </button>
      </form>

      <div class="pt-4 border-t border-slate-100 text-center text-xs text-slate-400">
        <p><i class="fa-solid fa-lock text-emerald-500"></i> Sesi terenkripsi & aman</p>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="p-6 text-center text-xs text-slate-400">
    <p>&copy; 2026 BuatDigital.id &bull; All Rights Reserved.</p>
  </footer>

  <script>
    // Redirect if already logged in
    const token = localStorage.getItem('bd_admin_token');
    if (token) {
      fetch('/api/admin/overview', { headers: { 'x-admin-token': token } })
        .then(r => { if (r.ok) window.location.href = '/admin'; });
    }

    async function handleLogin(e) {
      e.preventDefault();
      const pin = document.getElementById('pinInput').value;
      const btn = document.getElementById('loginBtn');
      const msg = document.getElementById('loginMsg');

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Memeriksa PIN...';
      msg.classList.add('hidden');

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin })
        });
        const data = await res.json();

        if (!res.ok) throw new Error(data.error || 'PIN Salah.');

        localStorage.setItem('bd_admin_token', data.token);
        msg.className = 'p-3 rounded-xl text-xs bg-emerald-50 text-emerald-700 border border-emerald-200 block';
        msg.innerHTML = '<i class="fa-solid fa-circle-check"></i> Login berhasil! Mengalihkan...';

        setTimeout(() => window.location.href = '/admin', 400);

      } catch (err) {
        msg.className = 'p-3 rounded-xl text-xs bg-rose-50 text-rose-700 border border-rose-200 block';
        msg.innerHTML = `<i class="fa-solid fa-circle-xmark"></i> ${err.message}`;
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-unlock"></i> Masuk ke Dashboard';
      }
    }
  </script>
</body>
</html>
